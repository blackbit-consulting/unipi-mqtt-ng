name: Build and Package

permissions:
  contents: read
  actions: write
  id-token: write
  attestations: write

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Compile TypeScript
        run: npm run compile
      - name: Pack npm package
        run: npm pack
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: '*.tgz'
      - name: Store npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
